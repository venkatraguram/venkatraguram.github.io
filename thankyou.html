<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Message Sent · Venkatraman Raguraman</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#090d0e;color:#dff4f4;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
nav{background:rgba(9,13,14,0.95);border-bottom:1px solid #1a2e30;padding:0 2rem;display:flex;align-items:center;height:56px}
.nav-name{font-size:14px;font-weight:600;color:#dff4f4}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem}
.box{text-align:center;max-width:420px}
.check-circle{width:72px;height:72px;border-radius:50%;background:#051a14;border:1px solid #0a3828;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;font-size:2rem;color:#00e5b0}
h1{font-size:1.8rem;font-weight:700;letter-spacing:-.02em;margin-bottom:.75rem}
p{color:#8ab8bc;font-size:15px;line-height:1.7;margin-bottom:2rem}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border-radius:8px;font-size:14px;font-weight:500;text-decoration:none;transition:all .2s}
.btn-primary{background:#00c9c8;color:#090d0e;font-weight:600}
.btn-primary:hover{background:#00b0af}
.btn-ghost{color:#dff4f4;border:1px solid #1a2e30}
.btn-ghost:hover{background:#0e1a1c}
footer{text-align:center;padding:1.5rem;font-size:12px;color:#527478;border-top:1px solid #1a2e30}
</style>
</head>
<body>
<nav><span class="nav-name">Venkatraman Raguraman</span></nav>
<main>
  <div class="box">
    <div class="check-circle">✓</div>
    <h1>Message sent!</h1>
    <p>Thanks for reaching out. I'll review your message and get back to you as soon as I can — usually within a day or two.</p>
    <div class="btns">
      <a href="/" class="btn btn-primary">Back to home</a>
      <a href="/projects.html" class="btn btn-ghost">View projects</a>
    </div>
  </div>
</main>
<footer>© 2026 Venkatraman Raguraman</footer>
</body>
</html>
